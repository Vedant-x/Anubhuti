<style>
/* Layout: a left rail of instruments + a working sheet; cards sit on drafting paper, dark mode is a night sky. */
:root {
  --bg: #faf7ff; --paper: #ffffff; --paper-2: #f8f4ff; --sunk: #f0eafa;
  --ink: #241638; --ink-2: #44345f; --muted: #6f6488; --line: #ebe3f6; --line-2: #d8cced;
  --saffron: #e2a523; --saffron-ink: #8a5a00; --saffron-soft: #fdf3dc;
  --indigo: #6a2fb0; --indigo-soft: #f1e8fd;
  --good: #11935a; --good-soft: #dff6ea; --warn: #c27c00; --warn-soft: #fff3d6; --bad: #e0362c; --bad-soft: #ffe3e0; --neutral-soft: #f1edf7;
  --el-water: #2f80ed; --el-air: #1fae6a; --el-fire: #f0532d; --el-earth: #e2a400; --el-space: #8a8fb0;
  --hero: linear-gradient(135deg, #ffffff 0%, #f6efff 55%, #fff6e3 100%);
  --brand-grad: linear-gradient(135deg, #8a46ec 0%, #5b22a8 100%);
  --font-display: 'Marcellus', 'Trajan Pro', Georgia, serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-deva: 'Tiro Devanagari Hindi', 'Noto Serif Devanagari', serif;
  --r: 10px; --r-sm: 7px;
  --shadow: 0 1px 2px rgba(20, 26, 46, .05), 0 6px 20px rgba(20, 26, 46, .06);
  --canvas-bg: #fbf9ff;
  --r: 14px; --r-sm: 9px;
  --shadow: 0 1px 2px rgba(60, 20, 110, .05), 0 8px 26px rgba(60, 20, 110, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130b22; --paper: #1d1233; --paper-2: #241840; --sunk: #170e2a;
    --ink: #f3eefc; --ink-2: #d8cdee; --muted: #a99cc4; --line: #33264d; --line-2: #46365f;
    --saffron: #f0bd4c; --saffron-ink: #f6cd6d; --saffron-soft: #3a2a10;
    --indigo: #c39bff; --indigo-soft: #2c1d4a;
    --good: #43c58c; --good-soft: #10301f; --warn: #e8b23f; --warn-soft: #362a0f; --bad: #f2695f; --bad-soft: #3a1614; --neutral-soft: #241a38;
    --el-water: #6aa3f0; --el-air: #52c597; --el-fire: #f27b57; --el-earth: #dcb04a; --el-space: #a3a9c0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    --canvas-bg: #160d27; --hero: linear-gradient(135deg, #24163d, #1d1233); --brand-grad: linear-gradient(135deg, #9a5cf5, #6a2fb0);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130b22; --paper: #1d1233; --paper-2: #241840; --sunk: #170e2a;
  --ink: #f3eefc; --ink-2: #d8cdee; --muted: #a99cc4; --line: #33264d; --line-2: #46365f;
  --saffron: #f0bd4c; --saffron-ink: #f6cd6d; --saffron-soft: #3a2a10;
  --indigo: #c39bff; --indigo-soft: #2c1d4a;
  --good: #43c58c; --good-soft: #10301f; --warn: #e8b23f; --warn-soft: #362a0f; --bad: #f2695f; --bad-soft: #3a1614; --neutral-soft: #241a38;
  --el-water: #6aa3f0; --el-air: #52c597; --el-fire: #f27b57; --el-earth: #dcb04a; --el-space: #a3a9c0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  --canvas-bg: #160d27; --hero: linear-gradient(135deg, #24163d, #1d1233); --brand-grad: linear-gradient(135deg, #9a5cf5, #6a2fb0);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg) radial-gradient(circle at 100% 0, color-mix(in srgb, var(--indigo) 8%, transparent), transparent 45%) fixed, var(--bg) radial-gradient(circle at 0 100%, color-mix(in srgb, var(--saffron) 9%, transparent), transparent 45%) fixed; background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 2.6vw, 2.2rem); letter-spacing: .01em; line-height: 1.15; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; letter-spacing: .01em; }
h3 { font-size: 1rem; font-weight: 650; }
h4 { font-size: .8rem; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
a { color: var(--indigo); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 4px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .92em; }
.deva { font-family: var(--font-deva); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.nowrap { white-space: nowrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; padding: 20px 14px 14px max(14px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--paper); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 44px; height: 44px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--saffron), 0 4px 12px rgba(80, 30, 140, .2); background: #fff; object-fit: cover; }
.brand-name { font-family: var(--font-display); font-size: 1.45rem; line-height: 1; letter-spacing: .02em; }
.brand-sub { color: var(--muted); font-size: .72rem; line-height: 1.25; font-style: italic; }
.brand-name { color: var(--indigo); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 14px 10px 4px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a svg { width: 19px; height: 19px; flex: none; color: var(--muted); }
.nav a:hover { background: var(--paper-2); }
.nav a[aria-current="page"] { background: var(--indigo-soft); color: var(--ink); }
.nav a[aria-current="page"] svg { color: var(--indigo); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.sync { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); padding: 0 10px; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.sync.cloud .dot { background: var(--good); }
.who { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--paper-2); cursor: pointer; text-align: left; width: 100%; }
.who:hover { border-color: var(--line-2); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; background: var(--saffron-soft); color: var(--saffron-ink); }
.main { min-width: 0; padding-block: 26px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1240px; margin: 0 auto; padding: 0 clamp(0px, 2vw, 18px); }
.topbar { display: none; }
.tabbar { display: none; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head .kicker { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--saffron-ink); font-weight: 650; margin-bottom: 4px; }
.page-head p.lede { color: var(--muted); max-width: 62ch; margin-top: 6px; }

/* ---------- surfaces ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.flat { box-shadow: none; }
.card.raised { box-shadow: var(--shadow); background: var(--hero); }
.card.raised .tithi-big { color: var(--saffron-ink); }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.sep { height: 1px; background: var(--line); margin: 4px 0; border: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: baseline; }
.kv dt { color: var(--muted); font-size: .85rem; }
.kv dd { margin: 0; font-weight: 550; min-width: 0; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .label { font-size: .74rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.stat .value { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.2; }
.stat .sub { font-size: .82rem; color: var(--muted); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty svg { width: 40px; height: 40px; color: var(--line-2); }
.note { font-size: .82rem; color: var(--muted); border-left: 2px solid var(--line-2); padding-left: 10px; }
.callout { border-radius: var(--r-sm); padding: 10px 12px; background: var(--paper-2); border: 1px solid var(--line); font-size: .9rem; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 36px; }
.btn:hover { background: var(--paper-2); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--brand-grad); border-color: transparent; color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--indigo) 30%, transparent); }
.btn.wide { width: 100%; border-radius: 99px; min-height: 46px; font-size: 1rem; }
.btn.primary:hover { opacity: .9; }
.btn.accent { background: var(--saffron); border-color: var(--saffron); color: #1b1203; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--paper-2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; min-height: 30px; font-size: .84rem; }
.btn.icon { padding: 7px; min-width: 36px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; padding: 8px 11px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--paper); min-height: 38px; }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.45; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--saffron) 55%, transparent); outline-offset: 0; border-color: var(--saffron); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--sunk); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-weight: 600; font-size: .84rem; color: var(--muted); cursor: pointer; }
.seg button svg { width: 18px; height: 18px; display: block; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; user-select: none; }
.check input { width: 16px; height: 16px; accent-color: var(--saffron); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 650; background: var(--neutral-soft); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.ok, .chip.mixed, .chip.fair { background: var(--warn-soft); color: var(--warn); }
.chip.bad, .chip.avoid { background: var(--bad-soft); color: var(--bad); }
.chip.great { background: var(--good); color: #fff; }
.chip.accent { background: var(--saffron-soft); color: var(--saffron-ink); }
.dot-q { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.dot-q.good { background: var(--good); } .dot-q.ok, .dot-q.neutral { background: var(--warn); } .dot-q.bad, .dot-q.avoid { background: var(--bad); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
.t th { text-align: left; font-weight: 650; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 9px 12px; background: var(--paper-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t tr.now td { background: var(--saffron-soft); }

/* ---------- Today ---------- */
.hero-day { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
.tithi-big { font-family: var(--font-display); font-size: clamp(1.9rem, 3.4vw, 2.6rem); line-height: 1.05; }
.moon-phase { width: 74px; height: 74px; flex: none; }
.timeline { position: relative; height: 54px; border-radius: 8px; background: var(--sunk); overflow: hidden; border: 1px solid var(--line); }
.timeline .band { position: absolute; top: 0; bottom: 0; }
.timeline .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
.timeline .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.timeline .now::after { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.tl-labels { position: relative; height: 18px; font-size: .72rem; color: var(--muted); }
.tl-labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chog { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.chog div { border-radius: 6px; padding: 6px 4px; text-align: center; font-size: .74rem; border: 1px solid transparent; }
.chog .good { background: var(--good-soft); color: var(--good); } .chog .ok { background: var(--warn-soft); color: var(--warn); } .chog .bad { background: var(--bad-soft); color: var(--bad); }
.chog .is-now { border-color: var(--ink); font-weight: 700; }
.chog b { display: block; font-size: .8rem; }
.planet-strip { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
.planet-strip > div { background: var(--paper-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; text-align: center; min-width: 0; }
.planet-strip .pg { font-family: var(--font-display); font-size: 1.05rem; }
.planet-strip .ps { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Vastu ---------- */
.vastu { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.stage { position: relative; background: var(--canvas-bg); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; height: min(74vh, 760px); min-height: 420px; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.stage canvas.placing { cursor: crosshair; }
.stage-tools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.stage-tools.right { left: auto; right: 10px; }
.stage-tools .btn { background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); }
.stage-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 6px 12px; border-radius: 99px; font-size: .8rem; z-index: 2; white-space: nowrap; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; }
.score-ring { width: 64px; height: 64px; flex: none; }
.panel { display: flex; flex-direction: column; gap: 14px; }
.panel .card { padding: 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border-bottom: 1px solid var(--line); margin: -2px 0 12px; }
.tabs button { border: 0; background: none; padding: 8px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; font-size: .9rem; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--saffron); }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper-2); cursor: pointer; font-weight: 600; font-size: .92rem; color: var(--ink-2); }
.step > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.step .step-n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); font-size: .8rem; font-weight: 700; flex: none; }
.step .step-n svg { width: 15px; height: 15px; }
.step.ok .step-n { background: var(--good); color: #fff; }
.step.open { border-color: var(--saffron); background: var(--saffron-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--saffron); }
.step.open .step-n:not(:has(svg)) { background: var(--saffron); color: #fff; }
.step-body { padding: 8px 4px 12px 8px; }
.dial { width: 132px; height: 132px; flex: none; touch-action: none; cursor: grab; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) 48px; align-items: center; gap: 8px; font-size: .8rem; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
.bar-row:hover, .bar-row.sel { background: var(--paper-2); }
.bar-row .track { position: relative; height: 14px; background: var(--sunk); border-radius: 4px; overflow: visible; }
.bar-row .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.bar-row .ideal { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.room-palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.room-palette button { display: flex; align-items: center; gap: 7px; text-align: left; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: .82rem; font-weight: 550; min-width: 0; }
.room-palette button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

          acc2 += span2;

  }
  function vimshottari(moonLon, birthJd) {
    const n = Math.floor(moonLon / NAK), frac = (moonLon - n * NAK) / NAK, li = n % 9;
    let start = birthJd - frac * DASHA_YRS[li] * YEAR;
    const out = [];
    for (let k = 0; k < 10; k++) {
      const i = (li + k) % 9, len = DASHA_YRS[i] * YEAR;
      const md = { lord: DASHA_LORDS[i], start, end: start + len, sub: [] };
      let s2 = start;
      for (let j = 0; j < 9; j++) {
        const a = (i + j) % 9, l2 = (len * DASHA_YRS[a]) / 120;
        const ad = { lord: DASHA_LORDS[a], start: s2, end: s2 + l2, sub: [] };
        let s3 = s2;
        for (let q = 0; q < 9; q++) {
          const b = (a + q) % 9, l3 = (l2 * DASHA_YRS[b]) / 120;
          ad.sub.push({ lord: DASHA_LORDS[b], start: s3, end: s3 + l3 });
          s3 += l3;
        }
        md.sub.push(ad); s2 += l2;
      }
      out.push(md); start += len;
    }
    return { balance: { lord: DASHA_LORDS[li], years: (1 - frac) * DASHA_YRS[li] }, periods: out };
  }
  function currentDasha(v, jd) {
    for (const md of v.periods) if (jd >= md.start && jd < md.end) {
      for (const ad of md.sub) if (jd >= ad.start && jd < ad.end) {
        for (const pd of ad.sub) if (jd >= pd.start && jd < pd.end) return { md, ad, pd };
        return { md, ad };

      return { md };

    return null;
  }

  function chart(profile) { return chartAt(jdLocal(profile.dob, profile.tob || '12:00', profile.place.tz), profile.place); }
  function chartAt(jd, place) {
    const profile = { place };
    const sid = siderealAll(jd), sid2 = siderealAll(jd + 0.5);
    const ay = ayanamsa(jd);
    const asc = norm(ascendantTrop(jd, profile.place.lat, profile.place.lon) - ay);
    const lagna = Math.floor(asc / 30);
    const planets = {};
    for (const p of D.PLANET_ORDER) {
      const lon = sid[p], sign = Math.floor(lon / 30), nk = Math.floor(lon / NAK);
      let retro = false;
      if (p === 'Rahu' || p === 'Ketu') retro = true;
      else if (p !== 'Sun' && p !== 'Moon') { let dd = sid2[p] - lon; if (dd > 180) dd -= 360; if (dd < -180) dd += 360; retro = dd < 0; }
      planets[p] = {
        lon, sign, deg: lon % 30, house: ((sign - lagna + 12) % 12) + 1, retro,
        nak: nk, nakName: D.NAKSHATRAS[nk].name, pada: Math.floor((lon % NAK) / (NAK / 4)) + 1,
        navamsa: Math.floor((lon * 9) / 30) % 12, dignity: dignity(p, sign), kp: kpLords(lon),
      };
    }
    // combustion (approximate orbs)
    const ORB = { Moon: 12, Mars: 17, Mercury: 13, Jupiter: 11, Venus: 9, Saturn: 15 };
    for (const p in ORB) { let d = Math.abs(planets[p].lon - planets.Sun.lon); d = Math.min(d, 360 - d); planets[p].combust = d < ORB[p]; }
    const ch = {
      jd, ayanamsa: ay, asc, lagna, ascNak: Math.floor(asc / NAK), ascNavamsa: Math.floor((asc * 9) / 30) % 12, ascKp: kpLords(asc), planets,
      moonSign: planets.Moon.sign, moonNak: planets.Moon.nak, dasha: vimshottari(planets.Moon.lon, jd),
    };
    ch.yogas = yogas(ch);

  /* ---------- Placidus cusps (KP) ---------- */
  function placidus(jd, lat, lon) {
    const ramc = lst(jd, lon), e = obliquity(jd), ay = ayanamsa(jd);
    const toLam = (ra) => norm(Math.atan2(sin(ra), cos(ra) * cos(e)) * R2D);
    const cusp = (f, above, start) => {
      let ra = ramc + start, lam = 0;
      for (let i = 0; i < 40; i++) {
        lam = toLam(ra);
        const dec = Math.asin(sin(e) * sin(lam)) * R2D;
        const x = Math.max(-1, Math.min(1, Math.tan(lat * D2R) * Math.tan(dec * D2R)));
        const ad = Math.asin(x) * R2D;
        ra = above ? ramc + f * (90 + ad) : ramc + 180 - f * (90 - ad);
      }
      return toLam(ra);
    };
    const c = new Array(13);
    c[1] = ascendantTrop(jd, lat, lon); c[10] = toLam(ramc);
    c[11] = cusp(1 / 3, true, 30); c[12] = cusp(2 / 3, true, 60); c[2] = cusp(2 / 3, false, 120); c[3] = cusp(1 / 3, false, 150);
    c[4] = norm(c[10] + 180); c[5] = norm(c[11] + 180); c[6] = norm(c[12] + 180); c[7] = norm(c[1] + 180); c[8] = norm(c[2] + 180); c[9] = norm(c[3] + 180);
    return c.map((x) => (x == null ? null : norm(x - ay)));
  }
  function kpHouses(ch) {
    const C = ch.cusps, P = ch.planets, planets = D.PLANET_ORDER;
    const houseOf = (lon) => { for (let h = 1; h <= 12; h++) { const a = C[h], b = C[h === 12 ? 1 : h + 1], span = norm(b - a); if (norm(lon - a) < span) return h; } return 1; };
    const occ = {}; for (let h = 1; h <= 12; h++) occ[h] = [];
    const pHouse = {}; planets.forEach((p) => { const h = houseOf(P[p].lon); pHouse[p] = h; occ[h].push(p); });
    const starOf = (p) => P[p].kp.star;
    const houses = [];
    for (let h = 1; h <= 12; h++) {
      const owner = D.SIGNS[Math.floor(C[h] / 30)].lord;
      const L2 = occ[h], L1 = planets.filter((p) => L2.includes(starOf(p)));
      const L4 = [owner], L3 = planets.filter((p) => starOf(p) === owner);
      houses.push({ h, cusp: C[h], kp: kpLords(C[h]), owner, occupants: L2, L1, L2, L3, L4, all: Array.from(new Set(L1.concat(L2, L3, L4))) });
    }
    const sig = {}; planets.forEach((p) => { sig[p] = houses.filter((x) => x.all.includes(p)).map((x) => x.h); });
    return { houses, pHouse, sig };
  }
  const KP_EVENTS = [ // name, main cusp, supporting houses, denying houses
    ['Marriage', 7, [2, 7, 11], [1, 6, 10]], ['Job / career', 10, [2, 6, 10, 11], [5, 8, 12]], ['Business', 7, [7, 10, 11], [6, 8, 12]],
    ['Property / home', 4, [4, 11, 12], [3, 5, 10]], ['Vehicle', 4, [4, 11], [3, 8, 12]], ['Children', 5, [2, 5, 11], [1, 4, 10]], ['Higher education', 9, [4, 9, 11], [3, 8, 12]],
    ['Foreign travel / settling', 12, [3, 9, 12], [4, 11]], ['Health trouble', 6, [1, 6, 8, 12], [5, 11]], ['Wealth gains', 11, [2, 6, 11], [5, 8, 12]],
  ];
  function kpEvents(ch, jd) {
    const sig = ch.kp.sig, cd = currentDasha(ch.dasha, jd);
    const lords = cd ? Array.from(new Set([cd.md.lord, cd.ad.lord, cd.pd && cd.pd.lord].filter(Boolean))) : [];
    return KP_EVENTS.map(([name, cuspNo, pos, neg]) => {
      const sup = D.PLANET_ORDER.filter((p) => pos.filter((h) => sig[p].includes(h)).length >= 2);
      const active = lords.filter((l) => pos.filter((h) => sig[l].includes(h)).length >= 2);
      const csl = ch.kp.houses[cuspNo - 1].kp.sub, cslSig = sig[csl] || [];
      const posN = pos.filter((h) => cslSig.includes(h)).length, negN = neg.filter((h) => cslSig.includes(h)).length;
      const promise = posN >= 1 && posN > negN;
      return { name, cusp: cuspNo, houses: pos, against: neg, supporters: sup, active, csl, cslHouses: cslSig, promise };
    });
  }

  /* ---------- Ashtakavarga ---------- */
  const AV = { // contributor order: Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn, Lagna
    Sun: [[1, 2, 4, 7, 8, 9, 10, 11], [3, 6, 10, 11], [1, 2, 4, 7, 8, 9, 10, 11], [3, 5, 6, 9, 10, 11, 12], [5, 6, 9, 11], [6, 7, 12], [1, 2, 4, 7, 8, 9, 10, 11], [3, 4, 6, 10, 11, 12]],
    Moon: [[3, 6, 7, 8, 10, 11], [1, 3, 6, 7, 10, 11], [2, 3, 5, 6, 9, 10, 11], [1, 3, 4, 5, 7, 8, 10, 11], [1, 4, 7, 8, 10, 11, 12], [3, 4, 5, 7, 9, 10, 11], [3, 5, 6, 11], [3, 6, 10, 11]],
    Mars: [[3, 5, 6, 10, 11], [3, 6, 11], [1, 2, 4, 7, 8, 10, 11], [3, 5, 6, 11], [6, 10, 11, 12], [6, 8, 11, 12], [1, 4, 7, 8, 9, 10, 11], [1, 3, 6, 10, 11]],
    Mercury: [[5, 6, 9, 11, 12], [2, 4, 6, 8, 10, 11], [1, 2, 4, 7, 8, 9, 10, 11], [1, 3, 5, 6, 9, 10, 11, 12], [6, 8, 11, 12], [1, 2, 3, 4, 5, 8, 9, 11], [1, 2, 4, 7, 8, 9, 10, 11], [1, 2, 4, 6, 8, 10, 11]],
    Jupiter: [[1, 2, 3, 4, 7, 8, 9, 10, 11], [2, 5, 7, 9, 11], [1, 2, 4, 7, 8, 10, 11], [1, 2, 4, 5, 6, 9, 10, 11], [1, 2, 3, 4, 7, 8, 10, 11], [2, 5, 6, 9, 10, 11], [3, 5, 6, 12], [1, 2, 4, 5, 6, 7, 9, 10, 11]],
    Venus: [[8, 11, 12], [1, 2, 3, 4, 5, 8, 9, 11, 12], [3, 5, 6, 9, 11, 12], [3, 5, 6, 9, 11], [5, 8, 9, 10, 11], [1, 2, 3, 4, 5, 8, 9, 10, 11], [3, 4, 5, 8, 9, 10, 11], [1, 2, 3, 4, 5, 8, 9, 11]],
    Saturn: [[1, 2, 4, 7, 8, 10, 11], [3, 6, 11], [3, 5, 6, 10, 11, 12], [6, 8, 9, 10, 11, 12], [5, 6, 11, 12], [6, 11, 12], [3, 5, 6, 11], [1, 3, 4, 6, 10, 11]],
  };
  function ashtakavarga(ch) {
    const P = ch.planets, refs = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].map((p) => P[p].sign).concat([ch.lagna]);
    const bav = {}, sav = new Array(12).fill(0);
    for (const pl in AV) {
      const row = new Array(12).fill(0);
      AV[pl].forEach((list, ci) => list.forEach((n) => { row[(refs[ci] + n - 1) % 12]++; }));
      bav[pl] = row; row.forEach((v, i) => (sav[i] += v));
    }
    return { bav, sav, total: sav.reduce((a, b) => a + b, 0) };
  }

  /* ---------- simplified planet strength (not full Shadbala) ---------- */
  function strength(ch) {
    const P = ch.planets, out = {};
    const DIG = { Sun: 10, Mars: 10, Jupiter: 1, Mercury: 1, Moon: 4, Venus: 4, Saturn: 7 };
    const DS = { Exalted: 30, 'Own sign': 25, Friendly: 18, Neutral: 12, Enemy: 6, Debilitated: 0 };
    for (const p of ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn']) {
      const q = P[p];
      let s = DS[q.dignity] || 10;
      const dist = Math.min(Math.abs(q.house - DIG[p]), 12 - Math.abs(q.house - DIG[p]));
      s += 20 * (1 - dist / 6);
      if (q.retro && p !== 'Sun' && p !== 'Moon') s += 8;
      if (q.combust) s -= 12;
      if (p === 'Moon') { const el = norm(P.Moon.lon - P.Sun.lon); s += (el > 180 ? 360 - el : el) / 180 * 15; }
      if ([1, 4, 7, 10].includes(q.house)) s += 10; else if ([5, 9].includes(q.house)) s += 8; else if ([6, 8, 12].includes(q.house)) s -= 5;
      if (q.navamsa === q.sign) s += 6; // vargottama
      s += ((ch.ashtaka ? ch.ashtaka.bav[p][q.sign] : 4) - 4) * 3;
      out[p] = Math.max(0, Math.min(100, Math.round(s * 1.15)));
    }
    return out;
  }

  /* ---------- Varshphal (Tajik annual chart) ---------- */
  function varshphal(profile, year) {
    const natal = chart(profile), target = natal.planets.Sun.lon;
    let jd = jdLocal(year + profile.dob.slice(4), profile.tob || '12:00', profile.place.tz);
    for (let i = 0; i < 8; i++) { let d = norm(sunSid(jd) - target); if (d > 180) d -= 360; jd -= d / 0.98565; }
    const v = chartAt(jd, profile.place);
    const age = year - +profile.dob.slice(0, 4);
    const muntha = (natal.lagna + age) % 12;
    return { jd, chart: v, age, muntha, munthaHouse: ((muntha - v.lagna + 12) % 12) + 1, munthaLord: D.SIGNS[muntha].lord, natal };
  }

  function yogas(ch) {
    const P = ch.planets, L = ch.lagna, res = [];
    const houseFrom = (s, ref) => ((s - ref + 12) % 12) + 1;
    const kendra = [1, 4, 7, 10];
    // Gajakesari
    const jm = houseFrom(P.Jupiter.sign, P.Moon.sign);
    res.push({ name: 'Gajakesari Yoga', present: kendra.includes(jm), kind: 'good', why: 'Jupiter is in house ' + jm + ' from the Moon' + (kendra.includes(jm) ? ' (a kendra). Brings wisdom, respect and lasting reputation.' : '; it needs a kendra (1, 4, 7, 10).') });
    res.push({ name: 'Budhaditya Yoga', present: P.Sun.sign === P.Mercury.sign, kind: 'good', why: P.Sun.sign === P.Mercury.sign ? 'Sun and Mercury together in ' + D.SIGNS[P.Sun.sign].en + '. Sharp intellect and communication.' + (P.Mercury.combust ? ' Mercury is combust, which weakens it.' : '') : 'Sun and Mercury are in different signs.' });
    res.push({ name: 'Chandra-Mangala Yoga', present: P.Moon.sign === P.Mars.sign, kind: 'good', why: P.Moon.sign === P.Mars.sign ? 'Moon and Mars conjunct. Earning drive and enterprise.' : 'Moon and Mars are in different signs.' });
    const mp = { Mars: 'Ruchaka', Mercury: 'Bhadra', Jupiter: 'Hamsa', Venus: 'Malavya', Saturn: 'Sasa' };
    for (const p in mp) {
      const h = P[p].house, strong = P[p].dignity === 'Exalted' || P[p].dignity === 'Own sign';
      if (kendra.includes(h) && strong) res.push({ name: mp[p] + ' Yoga (Pancha Mahapurusha)', present: true, kind: 'good', why: p + ' is ' + P[p].dignity.toLowerCase() + ' in house ' + h + ' from the lagna.' });
    }
    const near = ['Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].filter((p) => { const h = houseFrom(P[p].sign, P.Moon.sign); return h === 2 || h === 12; });
    const withMoon = ['Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].filter((p) => P[p].sign === P.Moon.sign);
    res.push({ name: 'Kemadruma Dosha', present: near.length === 0 && withMoon.length === 0, kind: 'bad', why: near.length || withMoon.length ? 'Cancelled: planets support the Moon (' + near.concat(withMoon).join(', ') + ').' : 'No planet in the 2nd or 12th from the Moon. Emotional ups and downs; reduced by a strong Moon or kendra planets.' });
    // Manglik
    const mh = P.Mars.house, mhm = houseFrom(P.Mars.sign, P.Moon.sign), MH = [1, 2, 4, 7, 8, 12];
    const man = MH.includes(mh), manM = MH.includes(mhm);
    res.push({ name: 'Manglik (Kuja) Dosha', present: man || manM, kind: 'bad', why: 'Mars is in house ' + mh + ' from the lagna and ' + mhm + ' from the Moon. ' + (man || manM ? 'Counts as Manglik ' + (man && manM ? 'from both' : man ? 'from the lagna' : 'from the Moon') + '. Many cancellations exist (e.g. Mars in own/exalted sign, or a Manglik partner).' : 'Not Manglik.') });
    // Kaal Sarp
    const seven = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'];
    const ds = seven.map((p) => norm(P[p].lon - P.Rahu.lon));
    const ks = ds.every((d) => d < 180) || ds.every((d) => d > 180);
    res.push({ name: 'Kaal Sarp Dosha', present: ks, kind: 'bad', why: ks ? 'All seven planets lie on one side of the Rahu-Ketu axis.' : 'Planets fall on both sides of the Rahu-Ketu axis.' });
    // Guru-Chandal
    const gc = P.Jupiter.sign === P.Rahu.sign;
    res.push({ name: 'Guru-Chandal Dosha', present: gc, kind: 'bad', why: gc ? 'Jupiter conjunct Rahu. Can confuse judgement and beliefs.' : 'Jupiter and Rahu are not together.' });
    // Vipreet raj (lords of 6, 8, 12 in 6, 8, 12)
    const lordOf = (h) => D.SIGNS[(L + h - 1) % 12].lord;
    const dus = [6, 8, 12];
    const vr = dus.filter((h) => { const l = lordOf(h); return l && P[l] && dus.includes(P[l].house); });
    if (vr.length) res.push({ name: 'Vipreet Raj Yoga', present: true, kind: 'good', why: 'Lord of house ' + vr.join(', ') + ' sits in a dusthana. Success after difficulty.' });
    // Dhana yoga: lords of 2/11 with 1/5/9 lords
    const tr = [1, 5, 9].map(lordOf), dh = [2, 11].map(lordOf);
    const dy = tr.some((a) => dh.some((b) => a !== b && P[a] && P[b] && P[a].sign === P[b].sign));
    if (dy) res.push({ name: 'Dhana Yoga', present: true, kind: 'good', why: 'A wealth-house lord (2 or 11) joins a trikona lord (1, 5 or 9).' });
    // Raj yoga: a kendra lord joins a trikona lord
    const kl = [1, 4, 7, 10].map(lordOf), tl = [5, 9].map(lordOf).concat([lordOf(1)]);
    const rj = [];
    kl.forEach((a) => tl.forEach((b) => { if (a !== b && P[a] && P[b] && P[a].sign === P[b].sign) { const k = [a, b].sort().join(' + '); if (!rj.includes(k)) rj.push(k); } }));
    if (rj.length) res.push({ name: 'Raj Yoga', present: true, kind: 'good', why: 'Kendra and trikona lords join: ' + rj.join(', ') + '. Authority, success and recognition.' });
    // Neecha bhanga
    ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].forEach((p) => {
      if (P[p].dignity !== 'Debilitated') return;
      const disp = D.SIGNS[P[p].sign].lord;
      const hL = P[disp] ? P[disp].house : 0, hM = P[disp] ? houseFrom(P[disp].sign, P.Moon.sign) : 0;
      if (kendra.includes(hL) || kendra.includes(hM)) res.push({ name: 'Neecha Bhanga Raj Yoga (' + p + ')', present: true, kind: 'good', why: p + ' is debilitated but its dispositor ' + disp + ' is in a kendra, cancelling the weakness.' });
    });
    const ben = ['Mercury', 'Jupiter', 'Venus'];
    const adhi = ben.filter((p) => [6, 7, 8].includes(houseFrom(P[p].sign, P.Moon.sign)));
    res.push({ name: 'Adhi Yoga', present: adhi.length >= 2, kind: 'good', why: adhi.length >= 2 ? adhi.join(', ') + ' in the 6th/7th/8th from the Moon. Leadership and comfort.' : 'Needs two or more benefics in the 6th, 7th or 8th from the Moon.' });
    const am = ben.filter((p) => P[p].house === 10 || houseFrom(P[p].sign, P.Moon.sign) === 10);
    if (am.length) res.push({ name: 'Amala Yoga', present: true, kind: 'good', why: am.join(', ') + ' in the 10th from lagna or Moon. Good reputation and clean character.' });
    const two = ['Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].filter((p) => houseFrom(P[p].sign, P.Moon.sign) === 2), twelve = ['Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn'].filter((p) => houseFrom(P[p].sign, P.Moon.sign) === 12);
    if (two.length && twelve.length) res.push({ name: 'Durudhara Yoga', present: true, kind: 'good', why: 'Planets on both sides of the Moon (' + two.concat(twelve).join(', ') + '). Wealth and support.' });
    else if (two.length) res.push({ name: 'Sunapha Yoga', present: true, kind: 'good', why: two.join(', ') + ' in the 2nd from the Moon. Self-made wealth.' });
    else if (twelve.length) res.push({ name: 'Anapha Yoga', present: true, kind: 'good', why: twelve.join(', ') + ' in the 12th from the Moon. Good health and charm.' });
    const pitra = ['Sun'].some((p) => P[p].sign === P.Rahu.sign || P[p].sign === P.Ketu.sign) || P.Sun.house === 9 && (P.Saturn.sign === P.Sun.sign);
    res.push({ name: 'Pitra Dosha (Sun-node)', present: pitra, kind: 'bad', why: pitra ? 'The Sun joins Rahu/Ketu (or Saturn in the 9th). Traditionally linked with ancestral karma; shraddha and tarpan help.' : 'The Sun is not afflicted by the nodes.' });
    const grahan = P.Moon.sign === P.Rahu.sign || P.Moon.sign === P.Ketu.sign;
    res.push({ name: 'Grahan Dosha (Moon-node)', present: grahan, kind: 'bad', why: grahan ? 'The Moon is with Rahu or Ketu. Can unsettle the mind; Shiva worship and Monday fasts are traditional remedies.' : 'The Moon is free of the nodes.' });
    return res;
  }

  /* Sade Sati / Dhaiya status from transiting Saturn against natal Moon sign */
  function saturnStatus(moonSign, jd) {
    const sat = Math.floor(norm(geoLon('Saturn', jd) - ayanamsa(jd)) / 30);
    const h = ((sat - moonSign + 12) % 12) + 1;
    if (h === 12) return { active: true, phase: 'Sade Sati, rising phase (Saturn 12th from Moon)', sat };
    if (h === 1) return { active: true, phase: 'Sade Sati, peak phase (Saturn over the Moon)', sat };
    if (h === 2) return { active: true, phase: 'Sade Sati, setting phase (Saturn 2nd from Moon)', sat };
    if (h === 4) return { active: true, phase: 'Kantaka Shani / Dhaiya (Saturn 4th from Moon)', sat };
    if (h === 8) return { active: true, phase: 'Ashtama Shani / Dhaiya (Saturn 8th from Moon)', sat };
    return { active: false, phase: 'No Sade Sati or Dhaiya now (Saturn ' + h + ' from Moon)', sat };
  }
  function tarabala(birthNak, todayNak) {
    const c = ((todayNak - birthNak + 27) % 27) % 9;
    return { index: c, ...Object.fromEntries(['name', 'q', 'note'].map((k, i) => [k, D.TARA[c][i]])) };
  }
  function chandrabala(birthMoonSign, todayMoonSign) {
    const h = ((todayMoonSign - birthMoonSign + 12) % 12) + 1;
    return { house: h, good: [1, 3, 6, 7, 10, 11].includes(h) };
  }

  /* month of panchang data at sunrise (for calendar & muhurat) */

  const RELW = { f: 'friend', n: 'neutral', e: 'enemy' };
  function milan(boy, girl, names) {
    const B = (names && names[0]) || 'The boy', Gl = (names && names[1]) || 'the girl';
    const bm = boy.planets.Moon, gm = girl.planets.Moon, rows = [], det = [];
    // 1 Varna

    // 2 Vashya
    const vb = vashyaGroup(bm.sign, bm.deg), vg = vashyaGroup(gm.sign, gm.deg), vsh = VASHYA_M[vb][vg];
    rows.push(['Vashya', 2, vsh, 'Dominance and attraction']);
    det.push(B + ' comes under ' + VASHYA_G[vb] + ' vashya and ' + Gl + ' under ' + VASHYA_G[vg] + ' vashya. ' + (vsh === 2 ? 'The same vashya gives easy attraction and give-and-take; neither tries to control the other, and they work as one unit.' : vsh >= 1 ? 'These groups get along well: there is mutual attraction and support, with only occasional tussles over who decides. Talking things through keeps the balance.' : vsh > 0 ? 'These groups are only partly compatible: one may feel the other is too dominant at times. Giving each other space and respect helps a great deal.' : 'These groups traditionally do not influence each other well: one partner may feel controlled or unheard. Patience and clear communication are important.'));
    // 3 Tara
    const tb = ((bm.nak - gm.nak + 27) % 27) % 9, tg = ((gm.nak - bm.nak + 27) % 27) % 9, bad = [2, 4, 6];
    const ts = (bad.includes(tb) ? 0 : 1.5) + (bad.includes(tg) ? 0 : 1.5);
    rows.push(['Tara', 3, ts, 'Destiny and well-being']);
    det.push('Counting the birth stars both ways, ' + B + ' falls in ' + TARA_N[tb] + ' tara and ' + Gl + ' in ' + TARA_N[tg] + ' tara. ' + (ts === 3 ? 'Both are favourable: they bring good fortune to each other, handle hard times together with confidence, and enjoy happiness and harmony at home.' : ts > 0 ? 'One count is favourable and the other is not: luck and health are mostly supportive, but one partner may need extra care during difficult periods. Mutual support makes up for it.' : 'Both counts fall in unfavourable taras (Vipat, Pratyari or Vadha): traditionally this asks for care with health and fortune. Remedies and a strong overall match reduce its effect.'));
    // 4 Yoni
    const yb = YONI_OF[bm.nak], yg = YONI_OF[gm.nak], ys = YONI_M[yb][yg];
    rows.push(['Yoni', 4, ys, 'Mentality and intimacy']);
    det.push('The boy’s yoni is ' + YONI_SA[yb] + ' (' + YONI_ANIMALS[yb].toLowerCase() + ') and the girl’s is ' + YONI_SA[yg] + ' (' + YONI_ANIMALS[yg].toLowerCase() + '). ' + (ys === 4 ? 'The same yoni gives deep physical and temperamental harmony; they understand each other’s needs naturally.' : ys === 3 ? 'These are friendly yonis: good physical compatibility and an easy temperament together.' : ys === 2 ? 'These yonis are neutral to each other: compatibility is average and grows with care and affection.' : ys === 1 ? 'These yonis are not natural friends: instincts and temperaments differ, and ego or jealousy can creep in. Setting egos aside and adjusting to each other keeps the relationship sustaining.' : 'These yonis are natural enemies (Yoni dosha): there can be strong differences in temperament and intimacy. Understanding, patience and remedies are recommended.'));
    // 5 Graha Maitri
    const lb = D.SIGNS[bm.sign].lord, lg = D.SIGNS[gm.sign].lord, r1 = rel(lb, lg), r2 = rel(lg, lb), k = [r1, r2].sort().join('');
    const gms = { ff: 5, fn: 4, nn: 3, ef: 1, en: 0.5, ee: 0 }[k];
    rows.push(['Graha Maitri', 5, gms, 'Mental compatibility']);
    det.push('The boy’s Moon sign lord is ' + lb + ' and the girl’s is ' + lg + '. ' + lb + ' treats ' + lg + ' as ' + (r1 === 'e' ? 'an ' : 'a ') + RELW[r1] + ', and ' + lg + ' treats ' + lb + ' as ' + (r2 === 'e' ? 'an ' : 'a ') + RELW[r2] + '. ' + (gms >= 4 ? 'Their minds work on the same wavelength: they share views, enjoy each other’s company and resolve differences easily.' : gms === 3 ? 'A neutral relationship: friendly enough, though they will need to make an effort to understand each other’s viewpoint.' : 'This is not a favourable planetary friendship: there may be attraction, but differences in outlook and routine can cause friction. It takes conscious effort from both; if the other kootas match well, the alliance can still be considered.'));
    // 6 Gana

  }
  /* Tabbed gun milan view: Details + one tab per koota with its own explanation */

  }
